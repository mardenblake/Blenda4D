schema_version = "1.0.0"

id = "blenda4d"
version = "0.1.54"
name = "Blenda 4D"
tagline = "A motion-design layout, managers and workflows for Blender"
maintainer = "Blenda 4D contributors"
type = "add-on"

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]
tags = ["User Interface", "3D View"]

[permissions]
files = "Saves layouts and asset folders, reads files you add as assets"
network = "Downloads other sizes of Poly Haven HDRIs when you ask"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "*.zip", ".DS_Store"]
